# Dependency nudges, tuned for low noise on a solo repo:
# - Groups collapse related bumps into single PRs (no more 5x package.json
#   conflicts, no more TanStack version splits).
# - Cooldown skips day-zero releases (let others find the breakage).
# - Tight PR caps + weekly cadence bound the queue.
# - TypeScript majors stay ignored (v7 breaks typescript-eslint v8, see #5).
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    cooldown:
      default-days: 5
    labels:
      - "dependencies"
    groups:
      # Version-coupled: must always move as one PR.
      tanstack:
        patterns:
          - "@tanstack/*"
      test-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      lint-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "prettier"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
